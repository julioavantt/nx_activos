<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Real JS - GOOG</title>
  <style>
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
   }
   body {
    background-color: #131722;
    color: #d1d4dc;
    font-family:
     -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
   }
   h1 {
    color: #ffffff;
    margin-bottom: 20px;
    font-size: 24px;
   }
   .dashboard-container {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 20px;
    height: calc(100vh - 80px);
    min-height: 600px;
   }
   .chart-box {
    background-color: #1c2030;
    border-radius: 8px;
    border: 1px solid #2a2e39;
    overflow: hidden;
   }
   .chart-box iframe {
    width: 100%;
    height: 100%;
    border: none;
   }
   .metrics-sidebar {
    display: flex;
    flex-direction: column;
    gap: 20px;
   }
   /* Contenedor donde JS inyectará el widget de métricas */
   #metrics-container {
    background-color: #1c2030;
    border-radius: 8px;
    border: 1px solid #2a2e39;
    flex: 1;
    overflow: hidden;
   }
   @media (max-width: 1024px) {
    .dashboard-container {
     grid-template-columns: 1fr;
     height: auto;
    }
    .chart-box {
     height: 500px;
    }
    #metrics-container {
     height: 450px;
    }
   }
  </style>
 </head>
 <body>
  <h1>Monitoreo de Mercado: Alphabet Inc. (GOOG)</h1>

  <div class="dashboard-container">
   <!-- Gráfico embebido personalizado (Tu diseño con Koncorde) -->
   <div class="chart-box">
    <iframe src="https://tradingview.com" allowfullscreen></iframe>
   </div>

   <!-- El contenedor vacío para las métricas -->
   <div id="metrics-container"></div>
  </div>

  <!-- CARGA DE LIBRERÍAS Y SCRIPT JS REAL -->
  <script type="text/javascript" src="https://tradingview.com"></script>
  <script type="text/javascript">
   // Instanciamos el widget lateral usando JavaScript puro
   new TradingView.MediumWidget({
    symbols: [["Google", "NASDAQ:GOOG|1D"]],
    chartOnly: false,
    width: "100%",
    height: "100%",
    locale: "es",
    colorTheme: "dark",
    gridLineColor: "rgba(42, 46, 57, 0.4)",
    trendLineColor: "#2962FF",
    fontColor: "#787B86",
    underLineColor: "rgba(41, 98, 255, 0.3)",
    underLineBottomColor: "rgba(41, 98, 255, 0)",
    isTransparent: true,
    autosize: true,
    showVolume: true,
    container_id: "metrics-container",
   });
  </script>
 </body>
</html>
