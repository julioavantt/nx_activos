<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Acciones - GOOG</title>
  <style>
   /* Estilos generales con la estética oscura de tu diseño */
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
   }
   body {
    background-color: #131722; /* Fondo oscuro original de TradingView */
    color: #d1d4dc;
    font-family:
     -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
   }
   h1 {
    color: #ffffff;
    margin-bottom: 20px;
    font-size: 24px;
    font-weight: 600;
   }
   /* Estructura de rejilla principal */
   .dashboard-container {
    display: grid;
    grid-template-columns: 3fr 1fr; /* 3 partes gráfico, 1 parte panel lateral */
    gap: 20px;
    height: calc(100vh - 80px);
    min-height: 600px;
   }
   /* Cajas contenedoras */
   .panel-box {
    background-color: #1c2030;
    border-radius: 8px;
    border: 1px solid #2a2e39;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    width: 100%;
    height: 100%;
   }
   iframe {
    width: 100%;
    height: 100%;
    border: none;
   }
   /* Adaptabilidad para móviles */
   @media (max-width: 1024px) {
    .dashboard-container {
     grid-template-columns: 1fr;
     height: auto;
    }
    .panel-box {
     height: 500px;
    }
   }
  </style>
 </head>
 <body>
  <h1></h1>
  <div class="dashboard-container">
   <div id="chart-container" class="panel-box"></div>
   <div id="metrics-container" class="panel-box"></div>
  </div>
  <div class="tradingview-widget-container">
   <div id="tradingview_chart"></div>
   <script
    type="text/javascript"
    src="https://s3.tradingview.com/tv.js"
   ></script>
   <script type="text/javascript">
    fetch("data.json")
     .then((r) => r.json())
     .then((d) => {
      const params = new URLSearchParams(window.location.search);
      const tickerParam = params.get("ticker");
      const ticker = d.find((item) => item.display_name === tickerParam);

      document.querySelector("h1").textContent =
       `${ticker.display_full_name} (${ticker.display_name})`;

      new TradingView.widget({
       width: "100%",
       height: 830,
       symbol: `${ticker.exchange}:${tickerParam}`,
       interval: "D",
       timezone: "Etc/UTC",
       theme: "dark",
       style: "1",
       locale: "es",
       toolbar_bg: "#f1f3f6",
       enable_publishing: false,
       allow_symbol_change: true,
       container_id: "chart-container",
      });
     });
   </script>
  </div>
 </body>
</html>
